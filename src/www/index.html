<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
  <title>AWG-Easy 3</title><link rel="icon" href="/img/favicon.ico"><link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="shell">
  <header class="topbar"><div class="brand"><img src="/img/logo.svg" alt="" width="44" height="44"><div><h1>AWG-Easy 3</h1><p>Простая панель для AmneziaWG 3.x</p></div></div><button id="logout" class="button ghost hidden" type="button">Выйти</button></header>
  <section id="login-view" class="card login-card"><h2>Вход в панель</h2><p>Панель доступна только домашним клиентам VPN.</p><form id="login-form"><label>Пароль<input id="password" type="password" required autocomplete="current-password"></label><button class="button primary" type="submit">Войти</button></form></section>
  <section id="app-view" class="hidden">
    <div class="toolbar card"><div><h2>Клиенты</h2><p>Home — домашняя сеть, Guest — только интернет.</p></div><button id="show-create" class="button primary" type="button">Добавить клиента</button></div>
    <div id="notice" class="notice hidden" role="status"></div><div id="clients" class="client-grid"></div>
    <section class="card settings"><h2>Пароль панели</h2><form id="password-form" class="form-row"><label>Текущий пароль<input id="current-password" type="password" required autocomplete="current-password"></label><label>Новый пароль<input id="new-password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button class="button" type="submit">Сменить пароль</button></form></section>
  </section>
</main>
<dialog id="create-dialog"><form id="create-form" method="dialog" class="dialog-card"><div class="dialog-title"><h2>Новый клиент</h2><button class="icon-button close-dialog" type="button" aria-label="Закрыть">×</button></div><label>Название<input id="client-name" maxlength="64" required placeholder="Телефон друга"></label><label>Доступ к сети<select id="client-group"><option value="guest">Guest — только интернет</option><option value="home">Home — домашняя сеть и панель</option></select></label><button class="button primary" type="submit">Создать</button></form></dialog>
<dialog id="profile-dialog"><div class="dialog-card profile-dialog"><div class="dialog-title"><h2 id="profile-title">Профиль клиента</h2><button class="icon-button close-dialog" type="button" aria-label="Закрыть">×</button></div><img id="profile-qr" class="qr" alt="QR-код профиля AmneziaVPN"><p id="profile-note">Отсканируйте QR-код в AmneziaVPN или откройте профиль на этом устройстве.</p><div class="actions"><button id="open-profile" class="button primary" type="button">Открыть в AmneziaVPN</button><button id="copy-profile" class="button" type="button">Копировать ссылку</button><a id="download-config" class="button ghost" href="#">Скачать .conf</a></div></div></dialog>
<template id="client-template"><article class="card client-card"><div class="client-heading"><div><h3 class="client-name"></h3><code class="client-address"></code></div><span class="status"></span></div><div class="switch-row"><div><strong>Домашняя сеть</strong><small>Home видит панель и других Home-клиентов</small></div><label class="switch"><input class="group-toggle" type="checkbox"><span></span></label></div><div class="switch-row"><div><strong>Клиент включён</strong><small>Отключение немедленно удаляет peer из AWG</small></div><label class="switch"><input class="enabled-toggle" type="checkbox"><span></span></label></div><div class="actions"><button class="button show-profile" type="button">QR и профиль</button><button class="button danger delete-client" type="button">Удалить</button></div></article></template>
<script src="/js/api.js" defer></script><script src="/js/app.js" defer></script>
</body></html>
