# Opt-in Main Node service for an existing AWG-Easy 3 panel.
# Enable only with enable-main-node.sh; never started by the base installer.
services:
  awg-easy:
    volumes:
      - ./cell-status:/cell-status:ro,z
      - ./cell-status/uapi:/run/amneziawg:z
    environment:
      AWG_MAIN_STATUS_FILE: /cell-status/cells.json
      AWG_MAIN_INVITATION_SOCKET: /cell-status/control.sock
  main-cell:
    profiles:
      - cells-main
    image: ${AWG_IMAGE:?Set the verified panel image}
    container_name: awg-easy-3-main-cell
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/data:ro,z
      - ./cell-data:/cell-data:Z
      - ./cell-status:/cell-status:z
      - ./cell-status/uapi:/run/amneziawg:z
    read_only: true
    tmpfs:
      - /run:mode=0700,size=16m
      - /tmp:mode=1777,size=32m
    security_opt:
      - no-new-privileges:true
    environment:
      AWG_MAIN_CELL_STATE_DIR: /cell-data
      AWG_MAIN_USER_STATE_FILE: /data/state.json
      AWG_MAIN_STATUS_FILE: /cell-status/cells.json
      AWG_MAIN_INVITATION_SOCKET: /cell-status/control.sock
      AWG_MAIN_USER_INTERFACE: ${AWG_MAIN_USER_INTERFACE:?Missing panel interface}
      AWG_MAIN_USER_PORT: ${AWG_MAIN_USER_PORT:?Missing panel UDP port}
      AWG_MAIN_BOOTSTRAP_INTERFACE: ${AWG_MAIN_BOOTSTRAP_INTERFACE:?Missing bootstrap interface}
      AWG_MAIN_CONTROL_INTERFACE: ${AWG_MAIN_CONTROL_INTERFACE:?Missing control interface}
      AWG_MAIN_BOOTSTRAP_PORT: ${AWG_MAIN_BOOTSTRAP_PORT:?Missing bootstrap UDP port}
      AWG_MAIN_CONTROL_PORT: ${AWG_MAIN_CONTROL_PORT:?Missing control UDP port}
      AWG_MAIN_REGISTRATION_PORT: ${AWG_MAIN_REGISTRATION_PORT:?Missing registration TCP port}
      AWG_MAIN_CONTROL_TCP_PORT: ${AWG_MAIN_CONTROL_TCP_PORT:?Missing control TCP port}
      AWG_MAIN_BOOTSTRAP_ADDRESS: ${AWG_MAIN_BOOTSTRAP_ADDRESS:?Missing bootstrap address}
      AWG_MAIN_CONTROL_ADDRESS: ${AWG_MAIN_CONTROL_ADDRESS:?Missing control address}
      AWG_MAIN_ENDPOINT: ${AWG_MAIN_ENDPOINT:?Missing endpoint}
      AWG_MAIN_DHT_PORT: ${AWG_MAIN_DHT_PORT:-49033}
    entrypoint:
      - /usr/bin/dumb-init
      - --
      - node
      - /app/main-cell-cli.js
    command:
      - serve
    stop_grace_period: 15s
    healthcheck:
      disable: true
