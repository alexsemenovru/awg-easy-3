# Dependency updates are proposed as PRs, never merged automatically.
# pnpm 11 updates remain manual until Dependabot supports our package manager:
# https://github.com/dependabot/dependabot-core/issues/14794
# Do not add docker-compose: the application's own image follows VERSION.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
